<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OCR Preprocessing Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
    .pair { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
    canvas, img { max-width: 480px; border: 2px solid #333; border-radius: 8px; }
    h3 { margin: 6px 0; font-size: 15px; }
    textarea { width: 100%; height: 160px; font-family: monospace; font-size: 13px; margin-top: 6px; box-sizing: border-box; }
    button { padding: 10px 20px; font-size: 15px; margin: 10px 4px; cursor: pointer; border-radius: 6px; border: none; background: #7C3AED; color: white; }
    .output-row { display: flex; gap: 20px; }
    .output-col { flex: 1; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .raw { background: #FEE2E2; color: #991B1B; }
    .clean { background: #D1FAE5; color: #065F46; }
  </style>
</head>
<body>
  <h1>OCR Preprocessing Visual Test</h1>
  <input type="file" id="fileInput" accept="image/*" style="font-size:15px; margin-bottom:16px;" />
  <br>
  <button onclick="runTest()">&#9654; Run Preprocess + OCR</button>
  <button onclick="loadSample()">&#128194; Load input1.jpeg (sample)</button>

  <div class="pair">
    <div>
      <h3>&#128247; Original Image</h3>
      <img id="originalImg" />
    </div>
    <div>
      <h3>&#11035; After Canvas Preprocessing</h3>
      <canvas id="processedCanvas"></canvas>
    </div>
  </div>

  <div class="output-row">
    <div class="output-col">
      <h3>&#128203; Raw Tesseract Output <span class="badge raw">unfiltered</span></h3>
      <textarea id="ocrRaw" placeholder="Raw OCR output will appear here..."></textarea>
    </div>
    <div class="output-col">
      <h3>&#10024; Cleaned Output <span class="badge clean">after filter</span></h3>
      <textarea id="ocrOutput" placeholder="Cleaned result will appear here..."></textarea>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script>
    let currentFile = null;

    document.getElementById('fileInput').onchange = (e) => {
      currentFile = e.target.files[0];
      document.getElementById('originalImg').src = URL.createObjectURL(currentFile);
      document.getElementById('ocrRaw').value = '';
      document.getElementById('ocrOutput').value = '';
    };

    async function loadSample() {
      const resp = await fetch('./sample-images/in-out/input1.jpeg');
      const blob = await resp.blob();
      currentFile = new File([blob], 'input1.jpeg', { type: 'image/jpeg' });
      document.getElementById('originalImg').src = URL.createObjectURL(currentFile);
      document.getElementById('ocrRaw').value = 'Sample loaded. Click Run to test.';
      document.getElementById('ocrOutput').value = '';
    }

    async function runTest() {
      if (!currentFile) { alert('Load an image first!'); return; }

      document.getElementById('ocrRaw').value = 'Preprocessing...';
      document.getElementById('ocrOutput').value = '';

      const processedDataUrl = await preprocessImageForOcr(currentFile);

      // Show preprocessed canvas
      const canvas = document.getElementById('processedCanvas');
      const img2 = new Image();
      img2.onload = () => {
        canvas.width = img2.width;
        canvas.height = img2.height;
        canvas.getContext('2d').drawImage(img2, 0, 0);
      };
      img2.src = processedDataUrl;

      document.getElementById('ocrRaw').value = 'Running Tesseract OCR...';
      const worker = await Tesseract.createWorker('eng');
      const result = await worker.recognize(processedDataUrl);
      await worker.terminate();

      const rawText = result.data.text || '(no text extracted)';
      const cleanedText = cleanExtractedText(rawText);

      document.getElementById('ocrRaw').value = rawText;
      document.getElementById('ocrOutput').value = cleanedText;
    }

    function preprocessImageForOcr(imgSource) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          let scale = 1.6;
          if (img.width > 1800 || img.height > 1800) scale = 1.1;
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imageData.data;

          for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i+1], b = data[i+2];
            const rn = r/255, gn = g/255, bn = b/255;
            const max = Math.max(rn,gn,bn), min = Math.min(rn,gn,bn);
            const saturation = max === 0 ? 0 : (max - min) / max;
            let finalVal;
            if (saturation > 0.25) {
              finalVal = 0; // colored pixel → BLACK (text or badge)
            } else {
              const gray = 0.299*r + 0.587*g + 0.114*b;
              finalVal = gray < 140 ? 0 : 255;
            }
            data[i] = data[i+1] = data[i+2] = finalVal;
          }
          ctx.putImageData(imageData, 0, 0);
          resolve(canvas.toDataURL('image/png'));
        };
        img.src = imgSource instanceof Blob ? URL.createObjectURL(imgSource) : imgSource;
      });
    }

    function cleanExtractedText(rawText) {
      if (!rawText) return 'No text found.';
      let clean = rawText.replace(/\r\n/g, '\n').replace(/[¢§©~|=_£\[\]\{\}\^\@\#\$\%\*\<\>\/\\]/g, ' ');
      const lines = clean.split('\n');
      const filteredLines = [];
      for (let line of lines) {
        const tokens = line.trim().split(/\s+/);
        const kept = [];
        for (const token of tokens) {
          const t = token.replace(/^[^a-zA-Z\u0900-\u097F]+|[^a-zA-Z\u0900-\u097F]+$/g, '');
          if (!t) continue;
          const alphaCount = (t.match(/[a-zA-Z\u0900-\u097F]/g) || []).length;
          if (t.length >= 2 && alphaCount / t.length >= 0.75) kept.push(t);
        }
        if (kept.length > 0) filteredLines.push(kept.join(' '));
      }
      const deduped = filteredLines.filter((l, i, a) => l !== a[i-1]);
      return deduped.join('\n').replace(/\n{3,}/g, '\n\n').trim() || 'No clear text detected.';
    }
  </script>
</body>
</html>
